---
name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * SUN"

jobs:
  # Test the image builds and works correctly.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: Test building image.
        run: just build docker-jenkins-ansible

      - name: Run the built image.
        run: docker run --name test-container -d docker-jenkins-ansible

      - name: Verify Jenkins is accessible in the built image.
        run: docker exec --tty test-container env TERM=xterm jenkins.sh --version

      - name: Verify Ansible is accessible in the built image.
        run: docker exec --tty test-container env TERM=xterm ansible --version

  # If on main branch, build and release image.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        run: just login ghcr.io "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push image.
        run: just release ghcr.io/${{ github.repository }}:latest
